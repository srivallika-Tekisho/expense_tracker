<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e4e2db;
      --text: #1a1a18;
      --muted: #8a8880;
      --accent: #1D9E75;
      --danger: #D85A30;
      --blue: #378ADD;
      --purple: #7F77DD;
      --pink: #D4537E;
      --amber: #BA7517;
      --gray: #888780;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--accent); }
    .server-badge {
      font-size: 12px; color: var(--muted);
      background: var(--bg); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 20px;
    }
    .server-badge.online { color: var(--accent); border-color: #9FE1CB; background: #E1F5EE; }
    .server-badge.offline { color: var(--danger); border-color: #F5C4B3; background: #FAECE7; }

    main { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 1.5rem;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.2rem 1.25rem;
    }

    .metric-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .metric-val { font-size: 26px; font-weight: 600; }
    .metric-val.green { color: var(--accent); }
    .metric-val.coral { color: var(--danger); }

    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
    }

    .card-title {
      font-size: 13px; font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
    }

    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); background: #fff; }

    .btn-submit {
      width: 100%;
      background: var(--text);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:active { transform: scale(0.98); }

    .right-col { display: flex; flex-direction: column; gap: 14px; }

    .filter-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .filter-row select {
      padding: 6px 10px; font-size: 13px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif; outline: none;
    }
    .filter-row label { font-size: 12px; color: var(--muted); }

    .expense-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }

    .expense-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      transition: border-color 0.15s;
    }
    .expense-item:hover { border-color: #ccc; }

    .cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .ei-body { flex: 1; min-width: 0; }
    .ei-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ei-meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .ei-amt { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .ei-del {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 15px; padding: 3px 6px;
      border-radius: 6px; transition: color 0.15s, background 0.15s;
      line-height: 1;
    }
    .ei-del:hover { color: var(--danger); background: #FAECE7; }

    .empty-state {
      text-align: center; padding: 2rem;
      color: var(--muted); font-size: 14px;
    }
    .empty-icon { font-size: 36px; margin-bottom: 8px; }

    .bar-list { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .bar-lbl { width: 90px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { flex: 1; background: var(--bg); border-radius: 6px; height: 7px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
    .bar-val { width: 70px; text-align: right; font-weight: 500; }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      padding: 10px 18px; border-radius: 10px;
      font-size: 13px; font-weight: 500; color: #fff;
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">💸 <span>Expense</span> Tracker</div>
  <div class="server-badge" id="server-badge">⬤ Connecting...</div>
</header>

<main>
  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Total spent</div>
      <div class="metric-val coral" id="m-total">₹0</div>
    </div>
    <div class="metric">
      <div class="metric-label">Transactions</div>
      <div class="metric-val" id="m-count">0</div>
    </div>
    <div class="metric">
      <div class="metric-label">Top category</div>
      <div class="metric-val green" id="m-top">—</div>
    </div>
  </div>

  <div class="layout">

    <!-- Left: Add form + Chart -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="card">
        <div class="card-title">Add expense</div>
        <div class="field">
          <label>Amount (₹)</label>
          <input type="number" id="f-amount" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="field">
          <label>Category</label>
          <select id="f-category">
            <option value="Food">🍛 Food</option>
            <option value="Transport">🚗 Transport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Health">💊 Health</option>
            <option value="Entertainment">🎬 Entertainment</option>
            <option value="Utilities">💡 Utilities</option>
            <option value="Other">📦 Other</option>
          </select>
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" id="f-desc" placeholder="What did you spend on?">
        </div>
        <button class="btn-submit" onclick="addExpense()">+ Add expense</button>
      </div>

      <div class="card">
        <div class="card-title">By category</div>
        <div class="bar-list" id="bar-chart">
          <div class="empty-state" style="padding:1rem 0;">No data yet</div>
        </div>
      </div>
    </div>

    <!-- Right: Expense list -->
    <div class="right-col">
      <div class="card" style="flex:1;">
        <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;">
          <span>Expenses</span>
          <div class="filter-row" style="margin:0;">
            <label>Filter:</label>
            <select id="filter-cat" onchange="renderList()">
              <option value="">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Health">Health</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Utilities">Utilities</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="expense-list" id="expense-list">
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            No expenses yet. Add one!
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const API = 'http://127.0.0.1:8000';
  const COLORS = {
    Food:'#1D9E75', Transport:'#378ADD', Shopping:'#D85A30',
    Health:'#D4537E', Entertainment:'#7F77DD', Utilities:'#BA7517', Other:'#888780'
  };

  let expenses = [];

  function showToast(msg, err) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = err ? '#A32D2D' : '#1D9E75';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function setServerStatus(online) {
    const b = document.getElementById('server-badge');
    b.textContent = online ? '⬤ Server online' : '⬤ Server offline';
    b.className = 'server-badge ' + (online ? 'online' : 'offline');
  }

  function updateMetrics() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    document.getElementById('m-total').textContent = '₹' + total.toLocaleString('en-IN', {maximumFractionDigits:2});
    document.getElementById('m-count').textContent = expenses.length;
    const bycat = {};
    expenses.forEach(e => bycat[e.category] = (bycat[e.category]||0) + e.amount);
    const top = Object.entries(bycat).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('m-top').textContent = top ? top[0] : '—';
    renderBars(bycat);
  }

  function renderBars(bycat) {
    const el = document.getElementById('bar-chart');
    const entries = Object.entries(bycat).sort((a,b)=>b[1]-a[1]);
    if (!entries.length) { el.innerHTML = '<div class="empty-state" style="padding:1rem 0;">No data yet</div>'; return; }
    const max = entries[0][1];
    el.innerHTML = entries.map(([cat, amt]) => `
      <div class="bar-row">
        <div class="bar-lbl">${cat}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/max*100)}%;background:${COLORS[cat]||'#888'};"></div></div>
        <div class="bar-val">₹${amt.toLocaleString('en-IN',{maximumFractionDigits:0})}</div>
      </div>`).join('');
  }

  function renderList() {
    const el = document.getElementById('expense-list');
    const filter = document.getElementById('filter-cat').value;
    let list = filter ? expenses.filter(e => e.category === filter) : expenses;
    list = [...list].reverse();
    if (!list.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>No expenses found.</div>';
      return;
    }
    el.innerHTML = list.map(e => `
      <div class="expense-item">
        <div class="cat-dot" style="background:${COLORS[e.category]||'#888'}"></div>
        <div class="ei-body">
          <div class="ei-desc">${e.description || e.category}</div>
          <div class="ei-meta">${e.category} &middot; ${e.date}</div>
        </div>
        <div class="ei-amt">₹${Number(e.amount).toLocaleString('en-IN',{maximumFractionDigits:2})}</div>
        <button class="ei-del" onclick="deleteExpense(${e.id})" title="Delete">✕</button>
      </div>`).join('');
  }

  async function loadExpenses() {
    try {
      const res = await fetch(`${API}/expenses/`);
      if (!res.ok) throw new Error();
      expenses = await res.json();
      setServerStatus(true);
      renderList();
      updateMetrics();
    } catch {
      setServerStatus(false);
      showToast('Cannot reach server — check uvicorn is running', true);
    }
  }

  async function addExpense() {
    const amount = parseFloat(document.getElementById('f-amount').value);
    const category = document.getElementById('f-category').value;
    const description = document.getElementById('f-desc').value.trim();
    if (!amount || amount <= 0) { showToast('Enter a valid amount', true); return; }
    try {
      const res = await fetch(`${API}/expenses/`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ amount, category, description: description || null })
      });
      if (!res.ok) throw new Error();
      const saved = await res.json();
      expenses.push(saved);
      renderList(); updateMetrics();
      document.getElementById('f-amount').value = '';
      document.getElementById('f-desc').value = '';
      showToast('Expense added!');
    } catch {
      showToast('Failed to save — is server running?', true);
    }
  }

  async function deleteExpense(id) {
    try {
      await fetch(`${API}/expenses/${id}`, { method: 'DELETE' });
    } catch {}
    expenses = expenses.filter(e => e.id !== id);
    renderList(); updateMetrics();
    showToast('Deleted');
  }

  loadExpenses();
</script>
</body>
</html>
